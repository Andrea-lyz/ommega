<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Ommega B</title>
  <link rel="stylesheet" href="./modern.css">
  <link rel="stylesheet" href="./b-modern.css">
</head>
<body class="om-modern">
  <header class="om-topbar"><div class="om-brand"><span class="om-logo" data-icon="shield"></span><div><div class="om-title">Ommega <span class="om-caption">B</span></div><div class="om-eyebrow">ATTESTATION / PROVIDER</div></div></div><button id="runtime-refresh" type="button" class="om-button secondary om-icon-button" data-label="刷新状态" data-icon="refresh"></button></header>
  <main class="om-content" id="main" tabindex="-1">
    <section class="om-view" id="overview-view">
      <div class="om-hero"><span id="relay-status" class="om-status" data-msg="正在读取 relay 状态…"></span><h1 data-msg="硬件证明，随时就绪。"></h1><p data-msg="管理专用 B 端的连接与设备信息。"></p><div class="om-flow" aria-label="A → Server → B"><div class="om-node">A<small data-msg="请求端"></small></div><span class="om-connector" data-icon="arrow"></span><div class="om-node">Server<small data-msg="转发"></small></div><span class="om-connector" data-icon="arrow"></span><div class="om-node">B<small data-msg="硬件 TEE"></small></div></div></div>
      <div class="om-grid">
        <article class="om-card"><div class="om-eyebrow" data-msg="设备 ID"></div><div class="om-stat om-stat-small" id="summary-device">—</div><p class="om-description" data-msg="专用设备"></p></article>
        <article class="om-card"><div class="om-eyebrow">SYSTEM SPL</div><div class="om-stat om-stat-small" id="summary-spl">—</div><p class="om-description" data-msg="当前系统属性"></p></article>
        <article class="om-card"><div class="om-eyebrow">ANDROID</div><div class="om-stat" id="summary-os">—</div><p class="om-description" data-msg="当前系统版本"></p></article>
      </div>
      <article class="om-card"><h2 data-msg="服务器"></h2><p id="summary-server" class="om-description">—</p><p class="om-note" data-msg="进程状态来自本机读取，不代表服务器已连接。"></p></article>
      <p id="runtime-time" class="om-updated" role="status" aria-live="polite"></p>
    </section>
    <section class="om-view" id="connection-view" hidden>
      <div class="om-row"><h1 class="om-section-title" data-msg="远程连接"></h1><button id="relay-reload" class="om-button secondary" type="button" data-msg="重新读取"></button></div>
      <p class="om-note" data-msg="连接参数保存后自动加载，正在处理的任务沿用原连接。"></p>
      <form id="relay-form" novalidate autocomplete="off"><fieldset id="relay-fields" disabled>
        <article class="om-card">
          <label class="field" for="relay-server"><span data-msg="服务器地址"></span><input id="relay-server" type="url" inputmode="url" placeholder="https://relay.example.com:8443" spellcheck="false" autocapitalize="none" required></label>
          <label class="field" for="relay-device"><span data-msg="设备 ID"></span><input id="relay-device" data-placeholder="与 Server 注册的设备 ID 一致" spellcheck="false" autocapitalize="none" required></label>
          <label class="field" for="relay-token">Token</label><div class="om-row"><input id="relay-token" type="password" aria-label="Token" data-placeholder="B 端连接凭据" autocomplete="new-password" spellcheck="false" autocapitalize="none" required><button id="token-toggle" type="button" class="om-button secondary" aria-pressed="false" data-msg="显示"></button></div>
          <details class="om-advanced"><summary data-msg="高级连接选项"></summary><label class="field" for="relay-machine"><span data-msg="机器 ID · 可选"></span><input id="relay-machine" data-placeholder="未分配时留空" spellcheck="false" autocapitalize="none"></label></details>
        </article>
        <article class="om-card"><h2 data-msg="日志"></h2><p class="om-note" data-msg="日志开关和级别在 relay 下次启动时生效。"></p><div class="logging">
          <div class="log-sink"><label class="toggle" for="file-log-enabled"><span data-msg="文件日志"></span><input id="file-log-enabled" type="checkbox"></label><label class="field" for="file-log-level"><span data-msg="记录级别"></span><select id="file-log-level" class="om-select"></select></label></div>
          <div class="log-sink"><label class="toggle" for="logcat-enabled"><span data-msg="系统日志（logcat）"></span><input id="logcat-enabled" type="checkbox"></label><label class="field" for="logcat-level"><span data-msg="记录级别"></span><select id="logcat-level" class="om-select"></select></label></div>
        </div></article>
        <button id="relay-save" type="submit" class="om-button" data-msg="保存 Relay 配置"></button>
      </fieldset></form>
      <div id="relay-message" class="om-message" role="status" aria-live="polite"></div>
    </section>
    <section class="om-view" id="settings-view" hidden>
      <h1 class="om-section-title" data-msg="设置与设备信息"></h1><div id="appearance"></div>
      <details class="om-card" id="spl-section"><summary data-msg="设备属性（SPL 与 OS 版本）"></summary>
        <p class="om-note" data-msg="单独保存和应用。修改 SPL 或 OS 版本会重载 KeyMint 与 keystore2；不能低于设备原始值，留空恢复原始值。在新日期下产生或升级过的密钥，降回旧日期后可能永久不可用。"></p>
        <label class="field" for="system">System SPL<input id="system" placeholder="YYYY-MM-DD"></label>
        <label class="field" for="boot">Boot SPL<input id="boot" placeholder="YYYY-MM-DD"></label>
        <label class="field" for="vendor">Vendor SPL<input id="vendor" placeholder="YYYY-MM-DD"></label>
        <label class="field" for="osversion"><span data-msg="OS 版本"></span><input id="osversion" inputmode="numeric" data-placeholder="如 17，留空恢复原始值"></label>
        <p class="om-note" data-msg="OS 版本只影响 ro.build.version.release 与证明 OS_VERSION；SDK 等级不变。"></p>
        <div class="actions"><button id="save" type="button" class="om-button" disabled data-msg="保存并应用"></button><button id="same" type="button" class="om-button secondary" data-msg="三项使用 System 值"></button><button id="auto" type="button" class="om-button secondary" data-msg="清空全部填写"></button></div>
        <div id="message" class="om-message" role="status" aria-live="polite"></div><p class="om-note" id="origin"></p><p class="om-note" data-msg="Boot SPL 是否被硬件接受，以新生成的证明证书为准。"></p><pre id="status" class="om-raw"></pre>
      </details>
    </section>
  </main>
  <nav class="om-nav" data-label="主导航"><button type="button" data-view="overview" aria-current="page"><span data-icon="overview"></span><span data-msg="概览"></span></button><button type="button" data-view="connection" aria-current="false"><span data-icon="settings"></span><span data-msg="连接"></span></button><button type="button" data-view="settings" aria-current="false"><span data-icon="apps"></span><span data-msg="设置"></span></button></nav>
  <script type="module" src="./app.js"></script>
</body>
</html>
