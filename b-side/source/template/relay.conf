# ommegaclient-b relay (B-side) configuration.
#
# This file is copied to /data/adb/ommega/relay.conf on first install and read by
# the relay service (template/service.sh).  Each line is KEY=VALUE;
# lines starting with '#' are treated as comments.  Values must not contain
# spaces (trailing/leading spaces are stripped).
#
# The relay daemon is the "new B-side" agent: it long-polls the relay_server
# (ommega-old) for tasks, mints real-TEE attestation chains with the A-side
# supplied appid (tag 709), and posts results back.  See src/bin/relay.rs.

# Base URL of the relay_server.  Both http:// and https:// are supported.
# The production relay_server runs over HTTPS on port 8443 with a self-signed
# certificate; trust it with OMMEGA_RELAY_TLS_PIN_SHA256 below.
OMMEGA_RELAY_SERVER=https://<relay-server>:8443

# TLS server authentication.  The relay token is only sent to a server whose
# certificate passes these checks.
# OMMEGA_RELAY_TLS_PIN_SHA256: SHA-256 of the server certificate's
#   SubjectPublicKeyInfo, as 64 hex digits or base64 (optional sha256/ prefix);
#   several pins may be comma-separated for key rotation.  When set, only a
#   server holding a pinned key is accepted.  Print the pin on the server with:
#   openssl x509 -in cert.pem -pubkey -noout | openssl pkey -pubin -outform der | openssl dgst -sha256
#   When empty, the certificate must chain to a public CA and match the host.
#   An invalid pin is a config error; the relay never falls back to no check.
# OMMEGA_RELAY_TLS_INSECURE: true = accept any certificate (unsafe, a network
#   attacker can capture the token).  Default false; ignored when a pin is set.
OMMEGA_RELAY_TLS_PIN_SHA256=
OMMEGA_RELAY_TLS_INSECURE=false

# Device id as registered on the relay_server (B-side, REQUIRED).
# This MUST match the A-side config's `device_id` key so tasks routed to that
# id are picked up by this B-side agent.  The relay_server matches tasks whose
# target_device_id is empty OR equal to this value.
# A-side default (client-a/module/config): device_id: device-b-2
OMMEGA_RELAY_DEVICE_ID=device-b-2

# Machine id used in the b/poll query (optional, default empty).
OMMEGA_RELAY_MACHINE_ID=

# Relay B-side token (sent as X-Relay-Token, REQUIRED by the relay client).
# The production relay_server now has RELAY_TOKEN configured in .env, so this
# MUST equal that value (currently <relay-token>).
# The A-side client-a config uses the same value for its `token` key.
OMMEGA_RELAY_TOKEN=<relay-token>

# Logging control (all sinks are managed here in one place).
# OMMEGA_RELAY_LOG_ENABLED: write /data/adb/ommega/logs/relay.log?
#   true=on (default), false=off.
# OMMEGA_RELAY_LOG_LEVEL: file log level.
#   off|error|warn|info|debug|trace (default debug).
# OMMEGA_RELAY_LOGCAT_ENABLED: Android logcat output (tag ommegaclient-b)?
#   true=on (default), false=fully silent.
# OMMEGA_RELAY_LOGCAT_LEVEL: logcat level.
#   off|error|warn|info|debug|trace (default info).
# These logging values take effect on the next relay start. Saving from WebUI
# does not restart relay, KeyMint or keystore2; connection settings hot-reload.
OMMEGA_RELAY_LOG_ENABLED=true
OMMEGA_RELAY_LOG_LEVEL=debug
OMMEGA_RELAY_LOGCAT_ENABLED=true
OMMEGA_RELAY_LOGCAT_LEVEL=info

# Keep the CPU awake while serving relay traffic, including with the screen off.
# Default true; this increases battery use. Requires CONFIG_PM_WAKELOCKS.
# A 90s kernel lease is renewed every 30s and expires if the relay stops.
# Config changes take effect within 30s without restarting services.
OMMEGA_RELAY_WAKELOCK=true

# Outgoing interface. auto = only bind when a VPN is up and the default route
# cannot reach the relay; none = never bind; always = always pick a physical
# uplink; or name one (wlan0 / rmnet_data0). Polls hold idle requests for 20s;
# a wrong pinned interface would make both polling and uploads unreachable.
# OMMEGA_RELAY_BIND_IFACE=auto

# Remote SOTER forwarding and capability probes are off until this device is
# explicitly validated. 0/false=off, 1/true=on.
OMMEGA_RELAY_SOTER_ENABLED=0

# SOTER key creation/removal changes real device state. Keep this disabled
# until the B-side device and the corresponding remote flow are approved.
# OMMEGA_RELAY_SOTER_MUTATION=0

# Optional existing slot for reporting proven signing capability. Both values
# are required. Without them, the relay may learn a slot from normal traffic;
# an inconclusive probe does not advertise either sign or no-sign.
# OMMEGA_RELAY_SOTER_PROBE_UID=<app-uid>
# OMMEGA_RELAY_SOTER_PROBE_ALIAS=<existing-auth-key-alias>
