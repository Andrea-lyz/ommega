# Pure-Rust cryptographic backend for ommega-a. This is an original
# implementation built on ring and RustCrypto crates, replacing the legacy
# BoringSSL-based backend from the upstream project.

[package]
name = "kmr-crypto-ommega"
authors = ["jiyin004"]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
default = []
# `nightly` enables the use of nightly-only standard library functionality,
# specifically fallible allocation. This requires nightly Rust.
nightly = []

[dependencies]
kmr-common = { path = "../common", version = "0.1.0" }
kmr-wire = { path = "../wire", version = "0.1.0" }
libc = "0.2.189"
log = "0.4.33"
anyhow = "1.0.104"
thiserror = "2.0.19"
nix = { version = "0.31.3", features = ["mman"] }
ring = "0.17"
aes = "0.8"
cipher = "0.4"
ctr = "0.9"
aes-gcm = "0.10"
des = "0.8"
hmac = "0.12"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hkdf = "0.12"
cmac = "0.7"
pbkdf2 = "0.12"
subtle = "2"
getrandom = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = { version = "0.9", features = ["sha2"] }
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "digest"] }
p384 = { version = "0.13", features = ["ecdsa", "ecdh", "digest"] }
p521 = { version = "0.13", features = ["ecdsa", "ecdh", "digest"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
x25519-dalek = { version = "2", features = ["static_secrets", "reusable_secrets"] }
ml-dsa = "0.1"
ecdsa = { version = "0.16", features = ["der"] }
elliptic-curve = { version = "0.13", features = ["sec1", "ecdh"] }
signature = "2"
der = { version = "0.8.1", features = ["alloc", "derive"] }
sec1 = { version = "0.8.1", features = ["alloc", "der"] }
spki = { version = "0.8.0" }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(soong)'] }
