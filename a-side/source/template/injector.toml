# With `[filter].enabled = true`, an application UID is intercepted when any package
# sharing that UID is listed in `scoop`.
# Filter deny settings still apply to every package resolved for the UID.

version = 1

scoop = [
  "io.github.vvb2060.keyattestation",
  "com.google.android.gsf",
  "com.google.android.gms",
  "com.android.vending",
  "com.eltavine.duckdetector",
  # OnePlus engineering mode calls KeyMint directly to inspect the chain; without
  # this it only sees the stock implementation.
  "com.oplus.engineermode",
]

[main]
enabled = true
log_level = "debug"

[filter]
# WebUI "Global scope": enabled=false bypasses all package/UID/deny filters.
# enabled=true restores the saved scope and the rules below.
enabled = true
deny_packages = []
block_android_package = true
allow_unknown_package = false
# Exact UID-1000 application process -> Binder SELinux context bindings.
# Both this binding and a scoop/target.txt entry are required. Native/system_server
# domains stay blocked. No binding is enabled by default.
system_app_contexts = {}
# Example after verifying the app's UID, process name and Binder SID:
# system_app_contexts = { "com.oplus.engineermode" = "u:r:engineermode_app:s0" }

# The keystore2 surface routes as a whole: with any switch enabled, every method
# of an allowed caller uses ommega; with none enabled, all of them pass to System.
[intercept]
get_security_level = true
get_key_entry = true
update_subcomponent = true
list_entries = true
delete_key = true
grant = true
ungrant = true
get_number_of_entries = true
list_entries_batched = true
get_supplementary_attestation_info = true
