name: Android Rust toolchain
description: Configure the pinned Android NDK and bindgen environment for one workspace
inputs:
  workspace:
    description: Cargo workspace to configure
    required: true
runs:
  using: composite
  steps:
    - name: Resolve host libclang
      id: clang
      shell: bash
      run: bash .github/scripts/resolve_libclang.sh
    - name: Install protoc
      uses: arduino/setup-protoc@v3
      with:
        version: "29.3"
        repo-token: ${{ github.token }}
    - name: Setup Android NDK
      uses: ./.github/actions/android-ndk
      id: ndk
    - name: Configure Android cargo
      shell: bash
      env:
        NDK_PATH: ${{ steps.ndk.outputs.ndk-path }}
        LIBCLANG_PATH: ${{ steps.clang.outputs.libclang-path }}
        WORKSPACE: ${{ inputs.workspace }}
      run: |
        llvm="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"
        sysroot="$llvm/sysroot"
        resource_dir="$(find "$llvm/lib/clang" -mindepth 1 -maxdepth 1 -type d | sort | tail -n1)"
        test -n "$resource_dir"
        bindgen="--target=aarch64-linux-android${ANDROID_PLATFORM} --sysroot=$sysroot -resource-dir=$resource_dir -isystem $resource_dir/include -isystem $sysroot/usr/include -isystem $sysroot/usr/include/aarch64-linux-android"
        {
          echo "ANDROID_NDK_HOME=$NDK_PATH"
          echo "ANDROID_NDK_ROOT=$NDK_PATH"
          echo "ANDROID_NDK=$NDK_PATH"
          echo "LIBCLANG_PATH=$LIBCLANG_PATH"
          echo "BINDGEN_EXTRA_CLANG_ARGS=$bindgen"
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=$bindgen"
        } >> "$GITHUB_ENV"
        python3 "$WORKSPACE/scripts/setup_cargo_config.py" --ndk-root "$NDK_PATH" --api-level "$ANDROID_PLATFORM" --force
