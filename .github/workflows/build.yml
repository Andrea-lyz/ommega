name: Build

on:
  push:
    branches: [master]
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      release_version:
        description: "Build version override (empty uses committed version; no automatic commit)"
        required: false
        type: string

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: nightly-2026-09-01
  ANDROID_PLATFORM: "26"

jobs:
  prepare:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve and check product version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            version=$(python3 .github/scripts/bump_version.py --version "$RELEASE_VERSION")
          else
            version=$(python3 .github/scripts/bump_version.py --check)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Test version synchronization
        run: python3 .github/scripts/test_bump_version.py
      - name: Test B WebUI configuration handling
        run: node --test b-side/source/scripts/webui.test.mjs

  android:
    name: Android ${{ matrix.component }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        component: [a, b]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set build version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 .github/scripts/bump_version.py --version "$RELEASE_VERSION"
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: aarch64-linux-android
          components: rustfmt,clippy
      - uses: ./.github/actions/android-toolchain
        with:
          workspace: ${{ matrix.component }}-side/source
      - name: Cache Android Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.component }}-side/source
          key: android-${{ matrix.component }}-ndk28c-api26
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Check Android workspace
        working-directory: ${{ matrix.component }}-side/source
        run: |
          # build.rs generates src/proto.rs on a clean checkout before rustfmt traverses it.
          cargo clippy --locked --target aarch64-linux-android --workspace --all-targets -- -D warnings
          cargo fmt --all -- --check
          cargo test --locked --target aarch64-linux-android --workspace --no-run
      - name: Build Android module
        working-directory: ${{ matrix.component }}-side/source
        run: |
          unset CARGO_TARGET_DIR
          python3 build.py --release --abi arm64-v8a
      - name: Verify B-side Android ELF linkage
        if: matrix.component == 'b'
        working-directory: b-side/source
        run: |
          relay=target/aarch64-linux-android/release/relay
          readelf="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"
          dynamic="$("$readelf" --dynamic "$relay")"
          printf '%s\n' "$dynamic"
          for library in libc.so libdl.so libm.so liblog.so; do
            if ! grep -Fq "Shared library: [$library]" <<<"$dynamic"; then
              echo "Missing required Android dependency: $library" >&2
              exit 1
            fi
          done
          symbols="$("$readelf" --dyn-syms --wide "$relay")"
          if grep -Eq '__loader_remove_thread_local_dtor|__scudo_default_options|_ZN5scudo20computeHardwareCRC32Ejm' <<<"$symbols"; then
            echo "B-side relay references private Bionic/Scudo runtime symbols" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ommega-${{ needs.prepare.outputs.version }}-${{ matrix.component }}
          if-no-files-found: error
          compression-level: 0
          path: ${{ matrix.component }}-side/source/target/*-release-arm64-v8a-*.zip

  server:
    name: Server Linux
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set build version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 .github/scripts/bump_version.py --version "$RELEASE_VERSION"
      - name: Install musl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          targets: x86_64-unknown-linux-musl
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server/source
          key: server-linux-musl
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Check and test Server
        working-directory: server/source
        run: |
          cargo clippy --locked --workspace --all-targets --no-deps
          cargo test --locked --workspace
      - name: Build Server
        working-directory: server/source
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-musl --bin relay_rs
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/relay_rs dist/relay_rs-linux-x86_64-musl
          chmod +x dist/relay_rs-linux-x86_64-musl
      - uses: actions/upload-artifact@v4
        with:
          name: ommega-${{ needs.prepare.outputs.version }}-server
          if-no-files-found: error
          compression-level: 0
          path: server/source/dist/relay_rs-linux-x86_64-musl

  apks:
    name: Android APKs
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set build version
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: python3 .github/scripts/bump_version.py --version "$RELEASE_VERSION"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;35.0.0"
      - name: Reuse default Android debug signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ommega-android-debug-signing-v1
      - name: Prepare default debug signing
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp "$HOME/.android/debug.keystore" b-app/source/debug.keystore
      - name: Test and build B-app
        working-directory: b-app/source
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --build-cache --parallel --no-daemon
      - name: Test and build StrongBoxCapabilityMask
        working-directory: StrongBoxCapabilityMask
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --build-cache --parallel --no-daemon
      - name: Verify and collect APKs
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p dist
          cp b-app/source/app/build/outputs/apk/release/app-release.apk "dist/Ommega-B-app-${RELEASE_VERSION}-debug-signed.apk"
          cp StrongBoxCapabilityMask/app/build/outputs/apk/release/app-release.apk "dist/StrongBoxCapabilityMask-${RELEASE_VERSION}-debug-signed.apk"
          for apk in dist/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: ommega-${{ needs.prepare.outputs.version }}-apks
          if-no-files-found: error
          compression-level: 0
          path: dist/*.apk

  bundle:
    name: Collect 1.4.x artifacts
    needs: [prepare, android, server, apks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ommega-${{ needs.prepare.outputs.version }}-*
          merge-multiple: true
          path: dist
      - name: Verify complete bundle and write checksums
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('dist')
          files = sorted(p for p in root.iterdir() if p.is_file())
          if len(files) != 5 or sum(p.suffix == '.zip' for p in files) != 2 or sum(p.suffix == '.apk' for p in files) != 2:
              raise SystemExit('Expected two module ZIPs, two APKs and one server binary')
          (root / 'build-info.json').write_text(json.dumps({'version': os.environ['RELEASE_VERSION'], 'commit': os.environ['SOURCE_COMMIT'], 'apk_signing': 'Android debug'}, indent=2) + '\n')
          files.append(root / 'build-info.json')
          (root / 'SHA256SUMS').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in files))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ommega-${{ needs.prepare.outputs.version }}
          if-no-files-found: error
          compression-level: 0
          path: dist/*
